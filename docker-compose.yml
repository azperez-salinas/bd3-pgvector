services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pgvector_movie_db
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: app_db
    ports:
      - "5433:5432"  # 5433 en el host: 5432 lo ocupa el Postgres local de Windows
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  embedder:
    build:
      context: ./embedder
    container_name: pgvector_movie_embedder
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "8000:8000"
    volumes:
      - hf_models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  loader:
    build:
      context: .
      dockerfile: scripts/Dockerfile.loader
    container_name: pgvector_movie_loader
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: app_db
      PGUSER: app_user
      PGPASSWORD: app_password
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
    container_name: pgvector_movie_backend
    environment:
      PORT: 3001
      EMBEDDER_URL: http://embedder:8000
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: app_db
      PGUSER: app_user
      PGPASSWORD: app_password
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      EMBEDDER_TIMEOUT_MS: ${EMBEDDER_TIMEOUT_MS:-30000}
      PG_CONNECTION_TIMEOUT_MS: ${PG_CONNECTION_TIMEOUT_MS:-5000}
      PGPOOL_MAX: ${PGPOOL_MAX:-10}
      HF_TOKEN: ${HF_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      GEMINI_TIMEOUT_MS: ${GEMINI_TIMEOUT_MS:-60000}
      GEMINI_TEMPERATURE: ${GEMINI_TEMPERATURE:-0.2}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      RAG_MAX_TOP_K: ${RAG_MAX_TOP_K:-20}
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
      embedder:
        condition: service_healthy
      loader:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    container_name: pgvector_movie_frontend
    environment:
      VITE_API_URL: http://localhost:3001/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgvector_data:
  hf_models:
