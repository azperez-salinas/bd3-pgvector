services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pgvector_movie_db
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: app_db
    ports:
      - "5433:5432"  # 5433 en el host: 5432 lo ocupa el Postgres local de Windows
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  embedder:
    build:
      context: ./embedder
    container_name: pgvector_movie_embedder
    ports:
      - "8000:8000"
    volumes:
      - hf_models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  backend:
    build:
      context: ./backend
    container_name: pgvector_movie_backend
    environment:
      PORT: 3001
      EMBEDDER_URL: http://embedder:8000
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: app_db
      PGUSER: app_user
      PGPASSWORD: app_password
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: pgvector_movie_frontend
    environment:
      VITE_API_URL: http://localhost:3001/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgvector_data:
  hf_models:
